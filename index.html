<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>空旅マップ</title>
<meta name="theme-color" content="#3b8de0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="空旅マップ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#eef3f8; --sea:#b9d3ea; --land:#f6f1e3; --landStroke:#6f8197;
  --ink:#1c2733; --sub:#5b6b7c; --line:#e3e9ef;
  --accent:#e2583e; --dom:#2f6fdb; --intl:#9b3fd1;
  --daily:#1f9d61; --weekly:#d9851a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{padding:10px 12px 8px;background:#fff;border-bottom:1px solid var(--line);z-index:5}
header h1{font-size:16px;margin:0 0 6px;font-weight:700;letter-spacing:.02em}
.searchRow{display:flex;gap:6px}
#q{flex:1;font-size:15px;padding:8px 10px;border:1px solid #cfd8e2;border-radius:10px;outline:none;background:#f7f9fb}
#q:focus{border-color:var(--dom);background:#fff}
#sugg{position:absolute;left:12px;right:12px;top:78px;background:#fff;border:1px solid #cfd8e2;border-radius:10px;
  box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:50vh;overflow:auto;display:none;z-index:20}
#sugg div{padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px}
#sugg div:active{background:#eef4ff}
#sugg small{color:var(--sub);margin-left:6px}
#mapWrap{position:relative;flex:1;overflow:hidden;background:var(--sea);touch-action:none}
svg{width:100%;height:100%;display:block}
.land{fill:var(--land);stroke:var(--landStroke);stroke-width:1.4;vector-effect:non-scaling-stroke;filter:drop-shadow(0 1px 1.5px rgba(40,60,90,.25))}
.ap{fill:var(--dom);stroke:#fff;vector-effect:non-scaling-stroke;stroke-width:1.5;cursor:pointer}
.ap.small{fill:#6f8db3}
.ap.dim{opacity:.25}
.ap.dest{fill:var(--accent)}
.ap.sel{fill:var(--accent);stroke:#fff;stroke-width:2.5}
.lbl{font-size:11px;fill:#33475b;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;pointer-events:none;font-weight:600}
.lbl.dim{opacity:.2}
.route{fill:none;stroke:var(--accent);stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.75;pointer-events:none}
.ctrls{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:4}
.ctrls button{width:38px;height:38px;border-radius:10px;border:1px solid #cfd8e2;background:#fff;font-size:18px;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.hint{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.92);border-radius:10px;padding:7px 10px;font-size:12px;color:var(--sub);z-index:4;max-width:62%}
/* sheet */
#sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.14);
  transform:translateY(100%);transition:transform .25s ease;z-index:10;max-height:62%;display:flex;flex-direction:column}
#sheet.open{transform:translateY(0)}
#sheet.mini{transform:translateY(calc(100% - 96px))}
.grab{width:42px;height:5px;border-radius:3px;background:#cfd8e2;margin:8px auto 4px}
.sheetHead{padding:2px 14px 8px;display:flex;align-items:flex-start;gap:8px}
.sheetHead h2{margin:0;font-size:18px;line-height:1.3}
.sheetHead .code{font-size:12px;color:var(--sub);font-weight:600;letter-spacing:.05em}
.sheetHead .meta{font-size:12px;color:var(--sub);margin-top:2px}
.closeBtn{margin-left:auto;border:none;background:#f0f3f6;border-radius:50%;width:32px;height:32px;font-size:16px;color:var(--sub);flex:none}
.tabs{display:flex;gap:6px;padding:0 14px 8px}
.tab{flex:1;padding:8px 6px;border-radius:10px;border:1px solid #d6dee7;background:#f7f9fb;font-size:14px;font-weight:600;color:var(--sub)}
.tab.on{background:var(--dom);border-color:var(--dom);color:#fff}
.tab.on.intl{background:var(--intl);border-color:var(--intl)}
.list{overflow:auto;padding:0 10px 18px;-webkit-overflow-scrolling:touch}
.region{font-size:14px;font-weight:800;color:#fff;background:var(--intl);border-radius:8px;padding:6px 10px;margin:14px 2px 2px}
.regionBar{position:sticky;top:0;background:#fff;z-index:2;padding-top:4px}
.grp{font-size:12px;color:var(--sub);font-weight:700;margin:10px 4px 4px}
.row{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid var(--line)}
.row.tap:active{background:#f3f7ff}
.row .dst{flex:1;min-width:0}
.row .dst b{font-size:15px}
.row .dst .al{font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.freq{flex:none;font-size:12px;font-weight:700;padding:4px 8px;border-radius:999px;white-space:nowrap}
.freq.d{background:#e3f5ec;color:var(--daily)}
.freq.w{background:#fdf0dc;color:var(--weekly)}
.freq.p{background:#ece6fb;color:#6b3fd1}
.plan{background:#f3effd;border:1px solid #d9cdf7;color:#4b2c99;border-radius:10px;padding:9px 11px;font-size:13px;margin:0 4px 8px;line-height:1.5}
.freq.s{background:#eef1f5;color:var(--sub)}
.empty{padding:18px 8px;color:var(--sub);font-size:14px}
.note{font-size:11px;color:var(--sub);padding:10px 6px 0;line-height:1.5}
.legend{display:flex;gap:10px;font-size:11px;color:var(--sub);margin-top:6px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:4px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.back{border:none;background:#f0f3f6;border-radius:10px;padding:6px 10px;font-size:13px;color:var(--ink);margin:0 14px 8px;font-weight:600}
.routeHead h2{font-size:19px}
.arrow{color:var(--accent);margin:0 4px}
.hour{font-size:12px;font-weight:700;color:var(--sub);margin:12px 4px 2px}
.fl{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--line)}
.fl .t{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;min-width:118px}
.fl .t small{font-weight:500;color:var(--sub);font-size:12px}
.fl .n{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12px;font-weight:700;color:#fff;border-radius:6px;padding:3px 7px;white-space:nowrap}
.chip.cs{opacity:.75}
.actions{display:flex;gap:6px;flex-wrap:wrap;padding:12px 4px 0}
.btn{border:1px solid #cfd8e2;background:#fff;border-radius:10px;padding:9px 11px;font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;display:inline-block}
.btn.pri{background:var(--dom);color:#fff;border-color:var(--dom)}
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 4px 6px}
.filters button{flex:none;border:1px solid #d6dee7;background:#f7f9fb;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--sub)}
.filters.dir button{font-size:13px;padding:7px 13px}
.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.row .go{color:#b0bccb;font-size:18px;flex:none}
.ally{font-size:10.5px;font-weight:700;border-radius:5px;padding:2px 6px;white-space:nowrap;border:1.5px solid}
.ally.a-star{background:#1b1b1b;color:#f3d36b;border-color:#1b1b1b}
.ally.a-ow{background:#5b2a86;color:#fff;border-color:#5b2a86}
.ally.a-st{background:#0a5ea8;color:#fff;border-color:#0a5ea8}
.ally.cs{background:transparent}
.ally.a-star.cs{color:#1b1b1b}.ally.a-ow.cs{color:#5b2a86}.ally.a-st.cs{color:#0a5ea8}
.allyRow{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.filters button.a-btn-star.on{background:#1b1b1b;color:#f3d36b}
.filters button.a-btn-ow.on{background:#5b2a86;border-color:#5b2a86}
.filters button.a-btn-st.on{background:#0a5ea8;border-color:#0a5ea8}

@media (min-width:900px){
  #sheet{left:auto;right:14px;top:14px;bottom:14px;width:430px;max-height:none;border-radius:16px;transform:translateX(calc(100% + 30px));box-shadow:0 8px 30px rgba(0,0,0,.18)}
  #sheet.open,#sheet.mini{transform:none}
  .grab{display:none}
  .ctrls{right:auto;left:14px;top:auto;bottom:18px}
  .hint{max-width:420px}
  .row.tap:hover,.fl:hover{background:#f3f7ff}
  .row.tap,.filters button,.tab,.btn,.back,.closeBtn{cursor:pointer}
  #mapWrap{cursor:grab}
  #mapWrap:active{cursor:grabbing}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>✈︎ 空旅マップ <small style="font-size:11px;color:#5b6b7c;font-weight:600">日本の空港の路線と時刻表</small></h1>
    <div class="searchRow"><input id="q" type="search" placeholder="空港名・コードで検索（例：伊丹、KIX）" autocomplete="off"></div>
    <div class="legend">
      <span><i class="dot" style="background:var(--daily)"></i>毎日運航</span>
      <span><i class="dot" style="background:var(--weekly)"></i>毎日ではない（週n便）</span>
      <span><i class="dot" style="background:#8a5cf0"></i>運航予定</span>
      <span><i class="dot" style="background:var(--dom)"></i>空港（タップで路線表示）</span>
      <span><span class="ally a-star">★</span>スター</span><span><span class="ally a-ow">◯</span>ワンワールド</span><span><span class="ally a-st">◇</span>スカイチーム</span>
    </div>
  </header>
  <div id="sugg"></div>
  <div id="mapWrap">
    <div class="hint" id="hint">空港の点をタップすると、国内線・国際線の行き先と運航頻度が表示されます。2本指で拡大できます。</div>
    <div class="ctrls">
      <button id="zin" aria-label="拡大">＋</button>
      <button id="zout" aria-label="縮小">－</button>
      <button id="zreset" aria-label="全体表示" style="font-size:14px">⟲</button>
    </div>
    <svg id="map" xmlns="http://www.w3.org/2000/svg">
      <g id="vp">
        <g id="landG"></g>
        <g id="routeG"></g>
        <g id="apG"></g>
        <g id="lblG"></g>
      </g>
    </svg>
    <div id="sheet">
      <div class="grab" id="grab"></div>
      <div class="sheetHead">
        <div>
          <div class="code" id="sCode"></div>
          <h2 id="sName"></h2>
          <div class="meta" id="sMeta"></div>
        </div>
        <button class="closeBtn" id="sClose" aria-label="閉じる">✕</button>
      </div>
      <button class="back" id="sBack" style="display:none">‹ 戻る</button>
      <div class="tabs" id="tabsBox">
        <button class="tab on" id="tDom">国内線</button>
        <button class="tab intl" id="tIntl">国際線</button>
      </div>
      <div class="list" id="sList"></div>
    </div>
  </div>
</div>

/* ---------- 解析 ---------- */
const parseFreq = f => {
  if (typeof f === "number") return {kind:"d", n:f, txt:`毎日 ${f}便`, score:f*7};
  const s = String(f).trim();
  if (/^\d+$/.test(s)) { const n=+s; return {kind:"d", n, txt:`毎日 ${n}便`, score:n*7}; }
  if (s === "w?") return {kind:"w", n:0, txt:"週数便", score:3};
  const m = s.match(/^w(\d+)$/);
  if (m) { const n=+m[1]; return n>=7 ? {kind:"d",n:Math.round(n/7),txt:`毎日 ${Math.round(n/7)}便`,score:n} : {kind:"w", n, txt:`週${n}便`, score:n}; }
  return {kind:"s", n:0, txt:s, score:0};
};
const DOM = {}; Object.keys(AIRPORTS).forEach(k => DOM[k] = []);
DOM_RAW.trim().split("\n").forEach(line => {
  const [pair, al, fq] = line.split("|"); const [a,b] = pair.split("-");
  if (!AIRPORTS[a] || !AIRPORTS[b]) return;
  const f = parseFreq(fq);
  DOM[a].push({to:b, al, f}); DOM[b].push({to:a, al, f});
});

const AL_NAME = {JAL:"JAL",ANA:"ANA",JTA:"JTA",IBX:"IBEX",AMX:"天草エアライン",SFJ:"スターフライヤー",JJP:"ジェットスター",APJ:"ピーチ",SKY:"スカイマーク",SNA:"ソラシドエア",ADO:"エア・ドゥ",TOK:"トキエア",FDA:"FDA",HAC:"HAC",ORC:"ORC",RAC:"RAC",SJO:"スプリング・ジャパン",NCA:"新中央航空",TAL:"東邦航空"};
const AL_COLOR = {JAL:"#d7263d",ANA:"#1a4fa0",JTA:"#d7263d",IBX:"#5a6b7d",AMX:"#2a9d8f",SFJ:"#222",JJP:"#f28c28",APJ:"#d63a8c",SKY:"#2b6cb0",SNA:"#5aa83c",ADO:"#e0a800",TOK:"#3aa3c9",FDA:"#8e44ad"};
const TT = {};
const alOf = fn => /^[A-Z]{3}\d/.test(fn) ? fn.slice(0,3) : fn.slice(0,2);
TT_RAW.trim().split("\n").forEach(line => {
  const [od, list] = line.split("|"); const [o, d] = od.split(">");
  const byTime = new Map();
  list.split(",").forEach(x => {
    const [tm, fn] = x.trim().split(" "); const [dep, arr] = tm.split("-");
    const key = dep + "-" + arr;
    if (!byTime.has(key)) byTime.set(key, []);
    byTime.get(key).push(fn);
  });
  // 共同運航（例 ANA3155＝IBX55）だけを1便にまとめる。JAL102とANA986のような同時刻の別便は分ける。
  const PARTNER = {ANA:["IBX","SFJ","SNA","ADO","ORC","AMX"], JAL:["AMX","FDA","ORC"]};
  const isCS = fn => { const a = alOf(fn), n = +fn.replace(/^[A-Z]+/,""); return (a==="ANA" && n>=2400) || (a==="JAL" && n>=3800); };
  const out = [];
  byTime.forEach((fns, key) => {
    const [dep, arr] = key.split("-");
    const ops = fns.filter(f => !isCS(f)).map(f => ({dep, arr, fl:[f]}));
    let orphan = null;
    fns.filter(isCS).forEach(cs => {
      const host = ops.find(g => (PARTNER[alOf(cs)]||[]).includes(alOf(g.fl[0])));
      if (host) host.fl.push(cs);
      else if (orphan) orphan.fl.push(cs);           // 運航会社の便名がない共同運航（例 JAL3830＝ANA4356）は1便に
      else { orphan = {dep, arr, fl:[cs]}; ops.push(orphan); }
    });
    out.push(...ops);
  });
  (TT[o] = TT[o] || {})[d] = out.sort((a,b)=>a.dep.localeCompare(b.dep));
});
// 時刻表を取り込んだ空港は、路線・便数・航空会社を実データで上書き（隠岐・但馬は一部のみ）
const TT_PARTIAL = ["OKI","TJH"];
const TT_FULL = Object.keys(TT).filter(o => !TT_PARTIAL.includes(o));
const alsOf = list => [...new Set(list.flatMap(f=>f.fl.map(alOf)))].map(a=>AL_NAME[a]||a).join("・");
// 1) 両方向とも時刻表に無い推定路線を削除
TT_FULL.forEach(o => {
  DOM[o].filter(r => !TT[o][r.to] && !(TT[r.to] && TT[r.to][o])).forEach(r => {
    DOM[o] = DOM[o].filter(x=>x!==r); DOM[r.to] = DOM[r.to].filter(x=>x.to!==o);
  });
});
// 2) 時刻表にある路線を追加・更新
Object.keys(TT).forEach(o => Object.keys(TT[o]).forEach(d => {
  if (!AIRPORTS[o] || !AIRPORTS[d]) return;
  const list = TT[o][d];
  let r = DOM[o].find(x=>x.to===d);
  if (!r) { r = {to:d}; DOM[o].push(r); }
  r.al = alsOf(list); r.f = parseFreq(list.length); r.real = true;

function parseFlights(list){
    const groups = new Map();
    list.split(",").forEach(x => {
      const [tm, ap, fls] = x.trim().split(" "); const [dep, arrRaw] = tm.split("-");
      const key = tm + " " + ap;
      if (!groups.has(key)) groups.set(key, {dep, arr: arrRaw.replace("+1",""), next: arrRaw.includes("+1"), ap, fl: []});
      groups.get(key).fl.push(...fls.split("/"));
    });
    const seen = new Set(), out = [];
    groups.forEach(g => {
      const fl = g.fl.filter(f => !seen.has(f)); fl.forEach(f => seen.add(f));
      if (!fl.length) return;
      fl.sort((a,b) => String(flNum(a)).length - String(flNum(b)).length || flNum(a) - flNum(b));
      out.push({...g, fl});
    });
    return out.sort((a,b)=>a.dep.localeCompare(b.dep));
}

  ITT[o] = txt.trim().split("\n").map(line => {
    const [city, cty, date, list] = line.split("|");
    return {city, cty, date, flights: parseFlights(list), ret: RET[city] || null};
  });
  if (false) txt.trim().split("\n").map(line => {
    const [city, cty, date, list] = line.split("|");
    const groups = new Map();
    list.split(",").forEach(x => {
      const [tm, ap, fls] = x.trim().split(" "); const [dep, arrRaw] = tm.split("-");
      const key = tm + " " + ap;
      if (!groups.has(key)) groups.set(key, {dep, arr: arrRaw.replace("+1",""), next: arrRaw.includes("+1") || arrRaw < dep && !/HNL|SFO|LAX/.test(ap), ap, fl: []});
      groups.get(key).fl.push(...fls.split("/"));
    });
    const seen = new Set(), out = [];
    groups.forEach(g => {
      const fl = g.fl.filter(f => !seen.has(f)); fl.forEach(f => seen.add(f));
      if (!fl.length) return;
      // 運航会社の推定：便名の桁数が少ないものを先頭に（共同運航便は4桁が多い）
      fl.sort((a,b) => String(flNum(a)).length - String(flNum(b)).length || flNum(a) - flNum(b));
      out.push({...g, fl});
    });
    out.sort((a,b)=>a.dep.localeCompare(b.dep));
    return {city, cty, date, flights: out};

  const nw = Math.max(W/14, Math.min(W*1.6, vb.w / f)); const k = nw / vb.w;

      const hr = f.dep.slice(0,2);
      if (hr !== lastH){ h += `<div class="hour">${+hr}時台</div>`; lastH = hr; }
      const chips = f.fl.map((fn,i) => `<span class="chip${i?" cs":""}" style="background:${AL_COLOR[alOf(fn)]||"#667"}">${fn.replace(/^([A-Z]+)/,"$1 ")}</span>`).join("");
      h += `<div class="fl"><div class="t">${f.dep} <small>→ ${f.arr}</small></div><div><div class="n">${chips}</div><div class="allyRow">${allyTags(f.fl)}</div></div></div>`;
    });
    h += `<div class="note">${TT_DATE}の駅探掲載の時刻表です。曜日や日付によって運休・時刻変更がある場合があります。同じ時刻に2つの便名がある便は共同運航（1機に2つの便名）です。アライアンス表示：塗りつぶし＝運航会社、枠だけ＝共同運航の便名（例：IBEX運航のANA便名）。</div>`;
  } else {
    const r = DOM[o].find(x=>x.to===d);
    h += `<div class="empty">この区間の便名・時刻はまだ取り込んでいません。<br>${r ? `目安：${r.f.txt}（${r.al}）` : ""}</div>`;
  }
  const url = ekitanUrl(o,d);
  h += `<div class="actions">` +
    (url ? `<a class="btn pri" href="${url}" target="_blank" rel="noopener">最新の時刻表を見る（駅探）</a>` : "") +
    (DOM[d].some(x=>x.to===o) ? `<button class="btn" id="revBtn">逆方向 ${AIRPORTS[d][0]}→${AIRPORTS[o][0]}</button>` : "") +
    `<button class="btn" id="destBtn">${AIRPORTS[d][0]}発の路線一覧</button></div>`;
  list.innerHTML = h; list.scrollTop = 0;
  list.querySelectorAll("[data-al]").forEach(b => b.onclick = () => { alFilter = b.dataset.al; renderRoute(); });
  list.querySelectorAll("[data-ally]").forEach(b => b.onclick = () => { allyFilter = b.dataset.ally; renderRoute(); });
  const rb = document.getElementById("revBtn"); if (rb) rb.onclick = () => openRoute(d, o, true);
  document.getElementById("destBtn").onclick = () => select(d);
}
let intlRoute = null, intlDir = "out", intlOrigin = null;
function openIntl(o, idx, dir){
  const base = INTL[o][idx][4]; intlOrigin = o; intlDir = dir || "out";
  const r = intlDir === "ret" ? {...base, ...base.ret, base, idx} : {...base, base, idx};
  intlRoute = r; routeDest = null; alFilter = "all"; allyFilter = "all"; setRouteMode(true);
  const aps = [...new Set(r.flights.map(f=>f.ap))].join("・");
  document.getElementById("sCode").textContent = intlDir==="ret" ? `${aps} → ${o}` : `${o} → ${aps}`;
  document.getElementById("sName").innerHTML = intlDir==="ret" ? `${r.city}<span class="arrow">→</span>${AIRPORTS[o][0]}` : `${AIRPORTS[o][0]}<span class="arrow">→</span>${r.city}`;
  document.getElementById("sMeta").textContent = r.base.badge ? `${r.cty}・${r.base.badge}（${r.date}）` : `${r.cty}・${r.flights.length}便（${r.date}の時刻表）`;
  renderIntl();
}
function renderIntl(){
  const r = intlRoute, list = document.getElementById("sList"); let h = "";
  h += `<div class="filters dir"><button data-dir="out" class="${intlDir==="out"?"on":""}">往路 ${AIRPORTS[intlOrigin][0]}発 ${r.base.flights.length}</button>` +
       (r.base.ret ? `<button data-dir="ret" class="${intlDir==="ret"?"on":""}">復路 ${r.city}発 ${r.base.ret.flights.length}</button>` : `<button disabled style="opacity:.5">復路データなし</button>`) + `</div>`;
  const ops = [...new Set(r.flights.map(f=>alOf(f.fl[0])))];
  if (ops.length > 1) h += `<div class="filters"><button data-al="all" class="${alFilter==="all"?"on":""}">すべて ${r.flights.length}</button>` +
    ops.map(a => `<button data-al="${a}" class="${alFilter===a?"on":""}">${AIRLINE2[a]||a} ${r.flights.filter(f=>alOf(f.fl[0])===a).length}</button>`).join("") + `</div>`;
  if (r.base.note) h += `<div class="plan">ℹ️ ${r.base.note}<br><small>出典：${r.base.src}</small></div>`;
  h += allyFilterBar(r.flights);
  const multiAp = new Set(r.flights.map(f=>f.ap)).size > 1;
  let lastH = "";
  r.flights.filter(f => (alFilter==="all" || alOf(f.fl[0])===alFilter) && allyOK(f)).forEach(f => {
    const hr = f.dep.slice(0,2); if (hr !== lastH){ h += `<div class="hour">${+hr}時台</div>`; lastH = hr; }
    const chips = f.fl.map((fn,i) => `<span class="chip${i?" cs":""}" style="background:${i? "#8a97a6" : (AL2_COLOR[alOf(fn)]||"#4a5868")}">${/\d/.test(fn) ? fn.slice(0,2)+" "+flNum(fn) : fn}</span>`).join("");
    h += `<div class="fl"><div class="t">${f.dep} <small>→ ${f.arr}${f.next?"<sup>+1</sup>":""}${multiAp?(intlDir==="ret"?" ("+f.ap+"発)":" "+f.ap):""}${f.days?"<br>"+f.days:""}</small></div><div><div class="n">${chips}</div><div class="allyRow">${allyTags(f.fl)}</div></div></div>`;
  });
  h += `<div class="note">${intlDir==="ret" ? "出発は現地時間、到着は日本時間です。" : "出発は日本時間、到着は現地時間です。"}濃い色の便名が運航会社（推定）、グレーは共同運航の便名です。アライアンス表示は塗りつぶし＝運航会社、枠だけ＝共同運航の便名で、マイル積算の目安になります（加算条件は各社でご確認ください）。駅探の${r.date}の掲載分で、曜日・季節によって運航しない便があります。</div>`;
  list.innerHTML = h; list.scrollTop = 0;
  list.querySelectorAll("[data-al]").forEach(b => b.onclick = () => { alFilter = b.dataset.al; renderIntl(); });
  list.querySelectorAll("[data-ally]").forEach(b => b.onclick = () => { allyFilter = b.dataset.ally; renderIntl(); });
  list.querySelectorAll("[data-dir]").forEach(b => b.onclick = () => openIntl(intlOrigin, r.idx, b.dataset.dir));
}
function fitCodes(codes){
  const xy = codes.map(c=>P(AIRPORTS[c][2],AIRPORTS[c][1]));
  fitBox(Math.min(...xy.map(p=>p[0])), Math.max(...xy.map(p=>p[0])), Math.min(...xy.map(p=>p[1])), Math.max(...xy.map(p=>p[1])));
}
document.getElementById("sBack").onclick = () => { const wasIntl = !!intlRoute && !routeDest; intlRoute = null; if (wasIntl) { tab = "intl"; noFit = true; } select(current); };
function focusOn(code){
  const [x,y] = P(AIRPORTS[code][2], AIRPORTS[code][1]);
  vb.x = x - vb.w/2; vb.y = y - vb.h*0.3; apply();
}
document.getElementById("tDom").onclick = () => { tab="dom"; renderList(); };
document.getElementById("tIntl").onclick = () => { tab="intl"; renderList(); };
document.getElementById("sClose").onclick = () => { current=null; sheet.className=""; drawRoutes(); fitAll(); };
document.getElementById("grab").onclick = () => { sheet.className = sheet.className==="open" ? "open mini" : "open"; };

/* ---------- 検索 ---------- */
const q = document.getElementById("q"), sugg = document.getElementById("sugg");
q.addEventListener("input", () => {
  const s = q.value.trim().toLowerCase(); if (!s){ sugg.style.display="none"; return; }
  const hits = Object.entries(AIRPORTS).filter(([c,[n]]) => c.toLowerCase().includes(s) || n.toLowerCase().includes(s)).slice(0,12);
  sugg.innerHTML = hits.map(([c,[n]]) => `<div data-c="${c}">${n}<small>${PREF_NOTE[c]!==undefined?"":c}</small></div>`).join("") || `<div>見つかりません</div>`;
  sugg.style.display = "block";
  sugg.querySelectorAll("[data-c]").forEach(d => d.onclick = () => { q.value=""; sugg.style.display="none"; q.blur(); select(d.dataset.c); });
});

fitAll();
try { if ("serviceWorker" in navigator && location.protocol === "https:" && window.top === window.self) navigator.serviceWorker.register("sw.js"); } catch (e) {}
</script>
